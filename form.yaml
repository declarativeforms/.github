version: 1
title: "Declarative Forms"
description: "Get early access to forms-as-code."

completion:
  title: "Thanks, {{data.question_2}}!"
  message: "You're on the list. Explore the docs to start building forms-as-code."
  button:
    label: "Explore the docs"
    url: "https://docs.declarativeforms.com"

sections:
  - id: section_1
    fields:
      - id: question_1
        type: email
        label: What's your email?
        placeholder: you@company.com
        otp: true
        validators:
          - required

      - id: question_2
        type: short_text
        label: What's your name?
        placeholder: Jane
        validators:
          - required

connections:
  - type: email
    to: "hirebarend@gmail.com"
    subject: "New submission - {{form.title}}"
    include_responses: true
