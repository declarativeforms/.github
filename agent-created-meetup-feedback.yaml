version: 1
title: "Meetup feedback"
sections:
  - id: feedback
    fields:
      - id: attendee_name
        type: short_text
        label: "Attendee name"
        validators: [required]
      - id: overall_rating
        type: rating
        label: "Overall rating"
        validators: [required]
      - id: favorite_part
        type: long_text
        label: "Favorite part"
      - id: improvement
        type: long_text
        label: "What could we improve?"
completion:
  title: "Thank you"
  message: "Your feedback has been received."
